name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - id: install
        run: npm ci
      # Each check runs even if an earlier one failed, so one run reports every failure.
      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint
      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test -- --ci
      - name: Android bundle
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run bundle
